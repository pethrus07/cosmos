<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cosmos.css">
</head>
<body>
  <!-- espaço: cada cena (nebulosas, estrelas distantes, astros) é feita de camadas estáticas que só giram
       (barato) e é trocada aos poucos; as estrelas que vêm na direção da tela, a estrela cadente e o cometa
       são o único desenho por quadro. Por cima: o tom da hora do dia e o pulso da música. -->
  <div id="fundo"></div>
  <div id="tom"></div>
  <div id="pulso"></div>
  <!-- o dia do Pedro (commits, notas, Hermes) virando constelações; depois matemática e versos -->
  <canvas id="constelacoes"></canvas>
  <div id="matematica"></div>
  <canvas id="estrelas"></canvas>

  <div id="espaco"></div>
  <!-- versos por cima das capas: são para ler -->
  <div id="versos"></div>

  <div id="tocando" aria-live="polite">
    <span class="rotulo">tocando agora</span>
    <span class="faixa"></span>
  </div>

  <script src="capas/capas.js"></script>
  <script src="capas/spotify.js"></script>
  <script src="dados/dia.js"></script>
  <script src="cosmos.js"></script>
  <script src="matematica.js"></script>
  <script src="constelacoes.js"></script>
  <script src="versos.js"></script>
</body>
</html>
